<!--
TRADING JOURNAL — ОБНОВЛЕНИЕ

Добавляет:
1. Выбор валютной пары/инструмента через стрелку.
2. Недавние инструменты.
3. Основные Forex-пары.
4. Другие инструменты: золото, крипто, индексы.
5. Возможность вводить свой инструмент.
6. Выбор даты в календаре.
7. Статистику выбранного дня:
   - начало дня
   - количество сделок
   - P&L
   - пополнения
   - выводы
   - конец дня
   - WIN / LOSS / WAIT
   - сделки и операции за день

ВАЖНО:
Этот блок вставляется ПЕРЕД </body>
в существующий рабочий index.html.
-->

<style>
.pair-picker{
  position:relative;
  margin-top:6px;
}

.pair-picker input{
  margin-top:0;
  padding-right:48px;
}

.pair-arrow{
  position:absolute;
  right:5px;
  top:5px;
  width:42px;
  height:42px;
  padding:0;
  border-radius:10px;
  background:#20262d;
  border:1px solid #303740;
  color:#fff;
  font-size:18px;
  z-index:2;
}

.pair-menu{
  position:absolute;
  left:0;
  right:0;
  top:calc(100% + 6px);
  background:#15191e;
  border:1px solid #303740;
  border-radius:14px;
  padding:8px;
  z-index:40;
  box-shadow:0 14px 35px rgba(0,0,0,.45);
  max-height:300px;
  overflow:auto;
}

.pair-menu.hidden{
  display:none;
}

.pair-menu-title{
  font-size:11px;
  color:#8f98a3;
  padding:5px 6px 7px;
}

.pair-menu-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.pair-option{
  background:#20262d;
  border:1px solid #303740;
  border-radius:10px;
  padding:10px 8px;
  text-align:left;
  color:#fff;
  font-size:13px;
}

.pair-option:active{
  transform:scale(.98);
}

.pair-option.recent{
  border-color:#75e0a1;
}

.day.tx-day{
  background:#111b25;
}

.day.has-events .day-dot{
  background:#7fb7ff;
}

.day.tx-day .day-dot{
  background:#7fb7ff;
}

.day-events{
  font-size:9px;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.day-start{
  background:#101822;
  border:1px solid #293644;
  border-radius:12px;
  padding:11px;
  margin:10px 0;
}

.day-start-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.day-start-box{
  background:#151c24;
  border:1px solid #293644;
  border-radius:10px;
  padding:9px;
}

.day-start-box b{
  display:block;
  margin-top:3px;
  font-size:16px;
}

.day-event{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #242a31;
}

.day-event:last-child{
  border-bottom:0;
}

.day-event-main{
  min-width:0;
}

.day-event-actions{
  flex:0 0 auto;
}
</style>

<script>

/* =========================================================
   TRADING JOURNAL — ВЫБОР ИНСТРУМЕНТА
   ========================================================= */

(function(){

  const oldPair=document.getElementById("pair");

  if(!oldPair || oldPair.dataset.pairPickerInstalled==="1"){
    return;
  }

  oldPair.dataset.pairPickerInstalled="1";

  const wrap=document.createElement("div");

  wrap.className="pair-picker";

  wrap.innerHTML=`
    <input
      id="pair"
      type="text"
      autocomplete="off"
      autocapitalize="characters"
      placeholder="EURUSD"
    >

    <button
      type="button"
      class="pair-arrow"
      id="pairArrow"
      aria-label="Выбрать инструмент"
    >⌄</button>

    <div
      id="pairMenu"
      class="pair-menu hidden"
    ></div>
  `;

  oldPair.replaceWith(wrap);

  const input=document.getElementById("pair");
  const arrow=document.getElementById("pairArrow");
  const menu=document.getElementById("pairMenu");


  /*
   * Основные Forex-пары
   */

  const forexPairs=[
    "EURUSD",
    "GBPUSD",
    "USDJPY",
    "USDCHF",
    "USDCAD",
    "AUDUSD",
    "NZDUSD",

    "EURGBP",
    "EURJPY",
    "EURCHF",
    "EURCAD",
    "EURAUD",
    "EURNZD",

    "GBPJPY",
    "GBPCHF",
    "GBPCAD",
    "GBPAUD",
    "GBPNZD",

    "AUDJPY",
    "AUDNZD",
    "AUDCAD",
    "AUDCHF",

    "NZDJPY",
    "NZDCAD",
    "NZDCHF",

    "CADJPY",
    "CADCHF",

    "CHFJPY"
  ];


  /*
   * Другие инструменты
   */

  const otherInstruments=[
    "XAUUSD",
    "XAGUSD",

    "BTCUSD",
    "ETHUSD",

    "US30",
    "NAS100",
    "SPX500",

    "GER40",
    "UK100",
    "FRA40",

    "USOIL",
    "UKOIL"
  ];


  /*
   * Недавние инструменты
   */

  if(!Array.isArray(window.recentPairs)){
    try{
      window.recentPairs=
        JSON.parse(localStorage.getItem("recentPairs")||"[]");
    }catch(e){
      window.recentPairs=[];
    }
  }


  function rememberPair(value){

    const pair=String(value||"")
      .trim()
      .toUpperCase();

    if(!pair || pair.length<3){
      return;
    }

    if(!Array.isArray(window.recentPairs)){
      window.recentPairs=[];
    }

    window.recentPairs=[
      pair,
      ...window.recentPairs.filter(
        x=>String(x).toUpperCase()!==pair
      )
    ].slice(0,8);

    localStorage.setItem(
      "recentPairs",
      JSON.stringify(window.recentPairs)
    );
  }


  function safe(value){

    return String(value)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }


  function makeButton(pair,recent){

    return `
      <button
        type="button"
        class="pair-option ${recent?"recent":""}"
        data-pair="${safe(pair)}"
      >
        ${safe(pair)}
      </button>
    `;
  }


  function renderPairChoices(){

    if(!menu){
      return;
    }

    const query=input.value
      .trim()
      .toUpperCase();


    const customPairs=
      Array.isArray(window.customPairs)
        ? window.customPairs
        : [];


    const all=[
      ...(Array.isArray(window.recentPairs)
        ? window.recentPairs
        : []),

      ...forexPairs,
      ...otherInstruments,
      ...customPairs
    ];


    const unique=[
      ...new Set(
        all
          .map(x=>String(x).trim().toUpperCase())
          .filter(Boolean)
      )
    ];


    const filtered=query
      ? unique.filter(
          p=>p.includes(query)
        )
      : unique;


    const recent=
      (window.recentPairs||[])
        .map(x=>String(x).toUpperCase())
        .filter(
          p=>!query || p.includes(query)
        )
        .slice(0,8);


    const recentSet=new Set(recent);


    const forex=filtered
      .filter(
        p=>forexPairs.includes(p)
      )
      .filter(
        p=>!recentSet.has(p)
      );


    const other=filtered
      .filter(
        p=>otherInstruments.includes(p)
      )
      .filter(
        p=>!recentSet.has(p)
      );


    const custom=filtered
      .filter(
        p=>customPairs
          .map(x=>String(x).toUpperCase())
          .includes(p)
      )
      .filter(
        p=>!recentSet.has(p)
      );


    let html="";


    if(recent.length){

      html+=`
        <div class="pair-menu-title">
          Недавние
        </div>

        <div class="pair-menu-grid">
          ${recent
            .map(
              p=>makeButton(p,true)
            )
            .join("")}
        </div>
      `;
    }


    if(forex.length){

      html+=`
        <div class="pair-menu-title">
          Forex
        </div>

        <div class="pair-menu-grid">
          ${forex
            .map(
              p=>makeButton(p,false)
            )
            .join("")}
        </div>
      `;
    }


    if(other.length){

      html+=`
        <div class="pair-menu-title">
          Другие инструменты
        </div>

        <div class="pair-menu-grid">
          ${other
            .map(
              p=>makeButton(p,false)
            )
            .join("")}
        </div>
      `;
    }


    if(custom.length){

      html+=`
        <div class="pair-menu-title">
          Мои инструменты
        </div>

        <div class="pair-menu-grid">
          ${custom
            .map(
              p=>makeButton(p,false)
            )
            .join("")}
        </div>
      `;
    }


    if(!filtered.length){

      html+=`
        <div
          class="muted"
          style="padding:10px"
        >
          Ничего не найдено
        </div>
      `;
    }


    /*
     * Добавить свой инструмент
     */

    html+=`
      <button
        type="button"
        id="addCustomPair"
        class="ghost"
        style="width:100%;margin-top:8px"
      >
        ＋ Добавить свой инструмент
      </button>
    `;


    menu.innerHTML=html;


    menu
      .querySelectorAll(".pair-option")
      .forEach(button=>{

        button.addEventListener(
          "click",
          ()=>{

            const value=
              button.dataset.pair;

            input.value=value;

            rememberPair(value);

            menu.classList.add("hidden");

            input.dispatchEvent(
              new Event(
                "change",
                {bubbles:true}
              )
            );
          }
        );

      });


    document
      .getElementById("addCustomPair")
      ?.addEventListener(
        "click",
        ()=>{

          const value=
            prompt(
              "Введите название инструмента"
            );

          const pair=
            String(value||"")
              .trim()
              .toUpperCase();

          if(!pair){
            return;
          }

          if(!Array.isArray(window.customPairs)){
            window.customPairs=[];
          }

          if(
            !window.customPairs
              .map(x=>String(x).toUpperCase())
              .includes(pair)
          ){

            window.customPairs.push(pair);

            localStorage.setItem(
              "customPairs",
              JSON.stringify(
                window.customPairs
              )
            );
          }

          input.value=pair;

          rememberPair(pair);

          menu.classList.add("hidden");

          input.dispatchEvent(
            new Event(
              "change",
              {bubbles:true}
            )
          );

        }
      );
  }


  try{

    window.customPairs=
      JSON.parse(
        localStorage.getItem(
          "customPairs"
        )||"[]"
      );

    if(!Array.isArray(window.customPairs)){
      window.customPairs=[];
    }

  }catch(e){

    window.customPairs=[];

  }


  arrow.addEventListener(
    "click",
    function(){

      renderPairChoices();

      menu.classList.toggle(
        "hidden"
      );

      if(
        !menu.classList.contains(
          "hidden"
        )
      ){

        input.focus();

      }

    }
  );


  input.addEventListener(
    "input",
    function(){

      renderPairChoices();

      if(
        menu.classList.contains(
          "hidden"
        )
      ){

        menu.classList.remove(
          "hidden"
        );

      }

    }
  );


  input.addEventListener(
    "change",
    function(){

      rememberPair(
        input.value
      );

    }
  );


  input.addEventListener(
    "blur",
    function(){

      setTimeout(
        ()=>{
          rememberPair(
            input.value
          );
        },
        150
      );

    }
  );


  document.addEventListener(
    "click",
    function(event){

      if(
        !wrap.contains(
          event.target
        )
      ){

        menu.classList.add(
          "hidden"
        );

      }

    }
  );


  window.renderPairChoices=
    renderPairChoices;


  renderPairChoices();

})();



/* =========================================================
   TRADING JOURNAL — КАЛЕНДАРЬ
   ========================================================= */

(function(){

  function getTradeDate(trade){

    if(
      typeof window.tradeDate==="function"
    ){

      return window.tradeDate(
        trade
      );

    }

    return String(
      trade.date ||
      trade.createdAt ||
      trade.at ||
      ""
    ).slice(0,10);

  }


  function getPnl(trade){

    if(
      typeof window.pnlOf==="function"
    ){

      return Number(
        window.pnlOf(
          trade
        )
      )||0;

    }

    const amount=
      Number(
        trade.amount
      )||0;

    if(
      trade.result==="WIN"
    ){

      const payout=
        Number(
          trade.payout
        );

      if(
        Number.isFinite(
          payout
        )
      ){

        return amount*
          (payout>1
            ? payout-1
            : payout
          );

      }

      return amount;

    }

    if(
      trade.result==="LOSS"
    ){

      return -amount;

    }

    return 0;

  }


  function getBalanceBeforeDate(date){

    let balance=
      Number(
        window.initialBalance
      )||0;


    const tx=
      Array.isArray(
        window.transactions
      )
        ? window.transactions
        : [];


    tx.forEach(
      item=>{

        const d=
          String(
            item.date||""
          ).slice(0,10);

        if(
          d &&
          d<date
        ){

          const amount=
            Number(
              item.amount
            )||0;

          balance+=
            item.type==="deposit"
              ? amount
              : -amount;

        }

      }
    );


    const tr=
      Array.isArray(
        window.trades
      )
        ? window.trades
        : [];


    tr.forEach(
      trade=>{

        const d=
          getTradeDate(
            trade
          );

        if(
          d &&
          d<date
        ){

          balance+=
            getPnl(
              trade
            );

        }

      }
    );


    return balance;

  }


  function getDayStats(date){

    const tr=
      Array.isArray(
        window.trades
      )
        ? window.trades
        : [];


    const tx=
      Array.isArray(
        window.transactions
      )
        ? window.transactions
        : [];


    const dayTrades=
      tr.filter(
        trade=>
          getTradeDate(
            trade
          )===date
      );


    const dayTransactions=
      tx.filter(
        item=>
          String(
            item.date||""
          ).slice(0,10)===date
      );


    const pnl=
      dayTrades.reduce(
        (sum,trade)=>
          sum+getPnl(trade),
        0
      );


    const deposits=
      dayTransactions
        .filter(
          x=>x.type==="deposit"
        )
        .reduce(
          (sum,x)=>
            sum+
            (Number(x.amount)||0),
          0
        );


    const withdrawals=
      dayTransactions
        .filter(
          x=>x.type==="withdraw"
        )
        .reduce(
          (sum,x)=>
            sum+
            (Number(x.amount)||0),
          0
        );


    const start=
      getBalanceBeforeDate(
        date
      );


    const end=
      start+
      pnl+
      deposits-
      withdrawals;


    return{
      trades:dayTrades,
      transactions:dayTransactions,
      pnl,
      deposits,
      withdrawals,
      start,
      end
    };

  }


  window.tradingJournalDayStats=
    getDayStats;


  /*
   * Выбранный день
   */

  window.selectTradingJournalDate=
    function(date){

      window.selectedDate=
        date;

      if(
        typeof window.renderCalendar===
        "function"
      ){

        window.renderCalendar();

      }

      showDayDetails(
        date
      );

    };


  function showDayDetails(date){

    const box=
      document.getElementById(
        "dayDetails"
      );


    if(!box){
      return;
    }


    const stats=
      getDayStats(
        date
      );


    const wins=
      stats.trades.filter(
        x=>x.result==="WIN"
      ).length;


    const losses=
      stats.trades.filter(
        x=>x.result==="LOSS"
      ).length;


    const waits=
      stats.trades.filter(
        x=>x.result==="WAIT"
      ).length;


    const dateText=
      date
        .split("-")
        .reverse()
        .join(".");


    let html=`

      <div
        class="muted"
        style="font-size:18px"
      >
        ${dateText}
      </div>

      <div class="day-start">

        <div
          class="row"
          style="font-size:18px"
        >

          <span>
            Старт дня
          </span>

          <b>
            ${money(stats.start)}
          </b>

        </div>


        <div
          class="row"
          style="margin-top:16px;font-size:18px"
        >

          <span>
            Сделок
          </span>

          <b>
            ${stats.trades.length}
          </b>

        </div>


        <div
          class="row"
          style="margin-top:16px;font-size:18px"
        >

          <span>
            P&L сделок
          </span>

          <b>
            ${money(stats.pnl)}
          </b>

        </div>


        <div
          class="row"
          style="margin-top:16px;font-size:18px"
        >

          <span>
            Пополнения
          </span>

          <b class="money-green">
            +${money(stats.deposits)}
          </b>

        </div>


        <div
          class="row"
          style="margin-top:16px;font-size:18px"
        >

          <span>
            Выводы
          </span>

          <b class="money-red">
            -${money(stats.withdrawals)}
          </b>

        </div>


        <div
          style="
            border-top:1px solid #293644;
            margin:18px 0 14px;
          "
        ></div>


        <div
          class="row"
          style="font-size:21px"
        >

          <b>
            Конец дня
          </b>

          <b>
            ${money(stats.end)}
          </b>

        </div>

      </div>


      <div
        style="
          font-size:16px;
          color:#8f98a3;
          margin:12px 0 20px;
        "
      >
        Результаты:
        ${wins} WIN ·
        ${losses} LOSS ·
        ${waits} WAIT
      </div>

    `;


    if(
      !stats.transactions.length &&
      !stats.trades.length
    ){

      html+=`
        <div
          class="empty"
          style="font-size:16px"
        >
          В этот день операций нет
        </div>
      `;

    }else{

      html+=`
        <div
          class="section-title"
        >
          Сделки и операции
        </div>
      `;


      stats.trades.forEach(
        trade=>{

          const pnl=
            getPnl(
              trade
            );


          const result=
            trade.result||
            "WAIT";


          const resultClass=
            result==="WIN"
              ? "win"
              : result==="LOSS"
                ? "loss"
                : "tag";


          html+=`

            <div class="day-event">

              <div class="day-event-main">

                <b>
                  ${safe(
                    trade.pair||
                    "Инструмент"
                  )}

                  ·

                  ${safe(
                    trade.side||
                    ""
                  )}
                </b>

                <div class="muted">

                  ${safe(
                    trade.tf||
                    "M1"
                  )}

                  ·

                  ${safe(
                    trade.expiry||
                    "—"
                  )}

                </div>

              </div>


              <div>

                <span
                  class="tag ${resultClass}"
                >
                  ${
                    result==="WAIT"
                      ? "WAIT"
                      : money(pnl)
                  }
                </span>

              </div>

            </div>

          `;

        }
      );


      stats.transactions.forEach(
        transaction=>{

          const amount=
            Number(
              transaction.amount
            )||0;


          const deposit=
            transaction.type==="deposit";


          html+=`

            <div class="day-event">

              <div class="day-event-main">

                <b>
                  ${
                    deposit
                      ? "💰 Пополнение"
                      : "💸 Вывод"
                  }
                </b>

                <div class="muted">
                  Операция по счёту
                </div>

              </div>


              <div>

                <b
                  class="${
                    deposit
                      ? "money-green"
                      : "money-red"
                  }"
                >
                  ${
                    deposit
                      ? "+"
                      : "-"
                  }${money(amount)}
                </b>

              </div>

            </div>

          `;

        }
      );

    }


    box.innerHTML=
      html;

    box.classList.remove(
      "hidden"
    );

  }


  /*
   * Если в текущем коде есть renderCalendar,
   * добавляем обработчик клика по дню,
   * не заменяя остальной календарь.
   */

  const oldRenderCalendar=
    window.renderCalendar;


  if(
    typeof oldRenderCalendar==="function"
  ){

    window.renderCalendar=
      function(){

        oldRenderCalendar();

        const days=
          document.querySelectorAll(
            "#calendarGrid .day"
          );


        days.forEach(
          day=>{

            const onclick=
              day.getAttribute(
                "onclick"
              );


            if(
              !onclick
            ){

              return;

            }


            const match=
              onclick.match(
                /selectDate\(['"]([^'"]+)['"]\)/
              );


            if(
              match
            ){

              day.setAttribute(
                "onclick",
                "selectTradingJournalDate('"+
                match[1]+
                "')"
              );

            }

          }
        );


        if(
          window.selectedDate
        ){

          showDayDetails(
            window.selectedDate
          );

        }

      };

  }


})();

</script>
